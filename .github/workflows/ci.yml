name: CI

# The site is hosted on Vercel, which builds and deploys every push to main
# (root directory: web). This workflow is the test gate: the pipeline tests,
# the web unit tests, and a production build of the static export.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pipeline tests that do not need a built warehouse still run: the
      # check definitions, the source contracts, and the role matrix. The rest
      # skip with a message rather than failing.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # anthropic and python-dotenv are imported by the text-to-SQL agent
      # module that tests/test_guard.py loads; they are not in pyproject's
      # dependencies yet, so CI installs them here. No API key is needed:
      # the tests never call the API.
      - run: pip install -e ".[dev]" anthropic python-dotenv
      - run: PYTHONPATH=src python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The guard and scope tests gate the build. Both document real bugs
      # (a WITH...DELETE bypass, and a clinical-advice question that returned
      # a table), so a regression should fail the check.
      - run: node --test lib/*.test.ts lib/ask/*.test.ts
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
