name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pipeline tests that do not need a built warehouse still run: the
      # check definitions, the source contracts, and the role matrix. The rest
      # skip with a message rather than failing.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: PYTHONPATH=src python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The guard and scope tests gate the deploy. Both document real bugs
      # (a WITH...DELETE bypass, and a clinical-advice question that returned
      # a table), so a regression should stop the site shipping.
      - run: node --test lib/*.test.ts
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /clinical-care-gap-explorer
      # Pages runs Jekyll by default, which ignores directories starting with _
      - run: touch web/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
