<style>
:root {
  color-scheme: light;
  --ground:   #f4f7f9;
  --surface:  #ffffff;
  --sunken:   #eef2f5;
  --ink:      #111c24;
  --muted:    #55646f;
  --faint:    #8696a2;
  --rule:     #dbe3e9;
  --rule-hi:  #c3cfd8;
  --blue:     #2a78d6;
  --blue-ink: #1d5ca8;
  --blue-wash:#e9f1fb;
  --cost:     #c24a16;
  --cost-wash:#fbeee7;

  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body:    "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:   #0c1317;
    --surface:  #131d23;
    --sunken:   #18242b;
    --ink:      #e1eaef;
    --muted:    #9aabb5;
    --faint:    #71838e;
    --rule:     #24333b;
    --rule-hi:  #35464f;
    --blue:     #4e99ea;
    --blue-ink: #86bbf0;
    --blue-wash:#13273a;
    --cost:     #e87b45;
    --cost-wash:#2a1c13;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:   #0c1317;
  --surface:  #131d23;
  --sunken:   #18242b;
  --ink:      #e1eaef;
  --muted:    #9aabb5;
  --faint:    #71838e;
  --rule:     #24333b;
  --rule-hi:  #35464f;
  --blue:     #4e99ea;
  --blue-ink: #86bbf0;
  --blue-wash:#13273a;
  --cost:     #e87b45;
  --cost-wash:#2a1c13;
}

* { box-sizing: border-box; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.65;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 44rem;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 0 6rem;
  display: flex;
  flex-direction: column;
  gap: 3rem;
}

p { margin: 0; }
strong { font-weight: 600; }
em { font-style: italic; }
code {
  font-family: var(--mono);
  font-size: .85em;
  background: var(--sunken);
  padding: .12em .38em;
  border-radius: 3px;
}
a { color: var(--blue); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }

/* ---------- masthead ---------- */
.mast { padding-block: 3.5rem 0; display: flex; flex-direction: column; gap: 1.1rem; }
.kicker {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--blue); margin: 0;
}
h1 {
  font-family: var(--display); font-weight: 500;
  font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 1.02;
  letter-spacing: -.02em; margin: 0; text-wrap: balance;
}
.standfirst {
  font-family: var(--display); font-size: 1.28rem; line-height: 1.5;
  color: var(--muted); margin: 0; max-width: 34ch;
}
.byline {
  font-family: var(--mono); font-size: .72rem; color: var(--faint);
  border-top: 1px solid var(--rule); padding-top: 1rem; line-height: 1.8;
}

/* ---------- the headline figure ---------- */
.headline {
  display: flex; flex-direction: column; gap: 1.25rem;
  border-block: 2px solid var(--ink); padding-block: 2rem;
}
.figure { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
.figure .n {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(3.2rem, 11vw, 5rem); line-height: .9;
  letter-spacing: -.035em; font-variant-numeric: tabular-nums;
}
.figure .of { font-family: var(--display); font-size: 1.5rem; color: var(--muted); }
.figure .unit { font-size: .95rem; color: var(--muted); flex-basis: 100%; margin-top: .2rem; }
.headline .lede { font-size: 1.08rem; line-height: 1.6; max-width: 38ch; }
.headline .lede b { color: var(--cost); font-weight: 600; }

/* ---------- the ledger ---------- */
.ledger { width: 100%; border-collapse: collapse; font-size: .92rem; }
.ledger td { padding: .5rem 0; border-bottom: 1px solid var(--rule); }
.ledger td:last-child {
  text-align: right; font-family: var(--mono);
  font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 1rem;
}
.ledger tr.key td { font-weight: 600; }
.ledger tr.key td:last-child { color: var(--cost); }
.ledger td.indent { padding-left: 1.1rem; color: var(--muted); }

/* ---------- findings ---------- */
.finding { display: flex; flex-direction: column; gap: 1rem; }
.fhead { display: flex; gap: 1rem; align-items: baseline; }
.fnum {
  font-family: var(--mono); font-size: .72rem; letter-spacing: .1em;
  color: var(--blue-ink); background: var(--blue-wash);
  padding: .3rem .5rem; border-radius: 4px; flex: none; align-self: flex-start;
}
h2 {
  font-family: var(--display); font-weight: 500;
  font-size: clamp(1.5rem, 4.4vw, 1.95rem); line-height: 1.18;
  letter-spacing: -.012em; margin: 0; text-wrap: balance;
}
.finding p + p { margin-top: -.3rem; }

/* ---------- the convergence, finding 3 ---------- */
.converge {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 10px; overflow: hidden;
}
.converge ul { margin: 0; padding: 0; list-style: none; }
.converge li {
  display: grid; grid-template-columns: 4.2rem 1fr; gap: .25rem 1rem;
  padding: .85rem 1.1rem; align-items: baseline;
}
.converge li + li { border-top: 1px solid var(--rule); }
.converge .count {
  font-family: var(--mono); font-size: .9rem; font-weight: 500;
  color: var(--cost); font-variant-numeric: tabular-nums;
}
.converge .what { font-size: .94rem; }
.converge .foot {
  background: var(--sunken); padding: .9rem 1.1rem;
  font-size: .92rem; color: var(--muted); border-top: 1px solid var(--rule);
}

/* ---------- charts ---------- */
figure { margin: 0; display: flex; flex-direction: column; gap: .7rem; }
figure img {
  width: 100%; max-width: 100%; display: block;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--surface);
}
figcaption { font-size: .85rem; color: var(--muted); line-height: 1.55; }

/* ---------- scorecard ---------- */
.scroller { overflow-x: auto; }
.score { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 30rem; }
.score th {
  text-align: left; font-family: var(--mono); font-size: .66rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  padding: .5rem .8rem .5rem 0; border-bottom: 1px solid var(--rule-hi); font-weight: 500;
}
.score th:last-child, .score td:last-child { text-align: right; padding-right: 0; }
.score td { padding: .55rem .8rem .55rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.score td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.score tr.total td { border-bottom: none; padding-top: .85rem; font-weight: 600; }
.score tr.total td:last-child { color: var(--blue); }

/* ---------- limits ---------- */
.limits { display: flex; flex-direction: column; gap: .9rem; margin: 0; padding: 0; }
.limits div { display: flex; flex-direction: column; gap: .15rem; }
.limits dt { font-weight: 600; font-size: .95rem; }
.limits dd { margin: 0; color: var(--muted); font-size: .93rem; line-height: 1.55; }

/* ---------- section rule ---------- */
.sec { display: flex; flex-direction: column; gap: 1.1rem; }
.sec > h3 {
  font-family: var(--display); font-weight: 500; font-size: 1.5rem;
  letter-spacing: -.01em; margin: 0; padding-top: 1.4rem;
  border-top: 2px solid var(--ink); text-wrap: balance;
}
.sec > p.intro { color: var(--muted); font-size: .97rem; max-width: 40ch; }

/* ---------- run block ---------- */
pre {
  margin: 0; background: var(--sunken); border: 1px solid var(--rule);
  border-radius: 8px; padding: 1rem 1.1rem; overflow-x: auto;
  font-family: var(--mono); font-size: .82rem; line-height: 1.7; color: var(--ink);
}
pre .c { color: var(--faint); }

footer {
  border-top: 1px solid var(--rule); padding-top: 1.4rem;
  font-family: var(--mono); font-size: .72rem; color: var(--faint); line-height: 1.9;
}
footer a { color: var(--blue); }

@media (max-width: 460px) {
  .fhead { flex-direction: column; gap: .5rem; }
  .converge li { grid-template-columns: 1fr; }
}
</style>
